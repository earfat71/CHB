version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coxbeach_db
    environment:
      POSTGRES_USER: ${DB_USER:-coxbeach}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coxbeach_dev}
      POSTGRES_DB: ${DB_NAME:-coxbeach}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coxbeach}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coxbeach_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
