server {
    listen 80;
    server_name coxbeach.com.bd www.coxbeach.com.bd;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name coxbeach.com.bd www.coxbeach.com.bd;

    ssl_certificate /etc/letsencrypt/live/coxbeach.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coxbeach.com.bd/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Frontend
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # API
    location /api/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # File uploads
    location /uploads/ {
        proxy_pass http://localhost:4000/uploads/;
    }

    client_max_body_size 20M;
}
